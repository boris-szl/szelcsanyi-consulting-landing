# Security response headers — included into every location so they are never
# dropped by nginx's add_header inheritance rules. `always` sends them on error
# responses too.

# Don't let browsers MIME-sniff responses away from the declared Content-Type.
add_header X-Content-Type-Options "nosniff" always;

# Disallow being framed (clickjacking). CSP frame-ancestors below is the modern twin.
add_header X-Frame-Options "DENY" always;

# Trim the referrer sent to other origins.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Turn off powerful browser features this site never uses.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

# Content Security Policy.
#   The full policy is generated per page by Astro and delivered in a
#   <meta http-equiv="content-security-policy"> element — that is what lets
#   script-src carry a SHA-256 hash for each inline script Astro emits (the
#   island bootstrap, the header menu, the reveal observer) instead of falling
#   back to 'unsafe-inline'. See `security.csp` in astro.config.mjs.
#
#   Only frame-ancestors is set here: it is ignored inside a <meta> element and
#   has to arrive as a response header. X-Frame-Options above is its twin for
#   older clients.
#
#   Do not re-add script-src/style-src here. Two policies are enforced
#   independently, so a second, hashless script-src would block every inline
#   script the generated policy permits.
add_header Content-Security-Policy "frame-ancestors 'none'" always;

# HSTS — Coolify/Traefik terminates TLS in front, so responses reach the client
# over HTTPS. Safe to preload once you're confident the domain is HTTPS-only.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# Block legacy cross-domain policy files.
add_header X-Permitted-Cross-Domain-Policies "none" always;
