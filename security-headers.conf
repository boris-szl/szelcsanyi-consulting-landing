# Security response headers — included into every location so they are never
# dropped by nginx's add_header inheritance rules. `always` sends them on error
# responses too.

# Don't let browsers MIME-sniff responses away from the declared Content-Type.
add_header X-Content-Type-Options "nosniff" always;

# Disallow being framed (clickjacking). CSP frame-ancestors below is the modern twin.
add_header X-Frame-Options "DENY" always;

# Trim the referrer sent to other origins.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Turn off powerful browser features this site never uses.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

# Content Security Policy.
#   script-src is strict 'self' (no inline JS — the app bundles everything).
#   Fonts are self-hosted, so no external font/style origins are allowed.
#   style-src keeps 'unsafe-inline' only for React's inline style attributes
#     (reveal animations); this does not weaken script protection.
#   connect-src / img-src allow cal.com — the /contact page books through the
#     Cal.com Platform API (@calcom/atoms) and renders avatars from their CDN.
# If you add analytics or an external API later, widen script-src / connect-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://cal.com https://app.cal.com; connect-src 'self' https://api.cal.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;

# HSTS — Coolify/Traefik terminates TLS in front, so responses reach the client
# over HTTPS. Safe to preload once you're confident the domain is HTTPS-only.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# Block legacy cross-domain policy files.
add_header X-Permitted-Cross-Domain-Policies "none" always;
