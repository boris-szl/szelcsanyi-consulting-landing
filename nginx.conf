server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Hardening -----------------------------------------------------------
    server_tokens off;              # don't leak the nginx version

    absolute_redirect off;          # emit relative redirects; TLS terminates upstream
    client_max_body_size 1m;        # this site takes no uploads
    include /etc/nginx/snippets/security-headers.conf;

    # Only read verbs are needed (the contact form is a client-side mailto).
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    # Never serve dotfiles (.git, .env, …). Keep ACME's /.well-known reachable.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # --- Caching -------------------------------------------------------------
    # Gzip text assets.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml application/rss+xml image/svg+xml;

    # Long-cache the fingerprinted build assets (filenames change on rebuild).
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Unfingerprinted static files — cache for a day, revalidate after.
    location ~* \.(png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # nginx's default mime.types has no .xsl entry, so without this the sitemap
    # stylesheet is served as application/octet-stream and the browser refuses
    # to apply it, leaving raw XML on screen. Scoped to this one file: a
    # server-level `types` block would replace the inherited map wholesale.
    location = /sitemap.xsl {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/xslt+xml;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Generated text endpoints — revalidate hourly rather than serve a stale feed.
    location ~* ^/(sitemap.*\.xml|rss\.xml|robots\.txt|llms(-full)?\.txt)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # --- Routing -------------------------------------------------------------
    # Canonical URLs carry no trailing slash (astro.config.mjs sets
    # `trailingSlash: 'never'`), so redirect the slashed form rather than
    # serving the same page at two URLs.
    location ~ ^(?<no_slash>/.+)/$ {
        return 301 $no_slash;
    }

    # The build is prerendered to directories (/work/onduty/index.html).
    # Resolve the index file directly rather than with `$uri/`, which makes
    # nginx 301 to the trailing-slash form and fight the redirect above.
    #
    # This block serves the HTML, so the no-cache header lives here: a stale
    # document is also a stale CSP. Anything genuinely missing gets a real 404
    # status — not a 200 shell, which would let dead URLs into the index.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }

    # Astro special-cases the 404 route to dist/404.html rather than a
    # directory index, so this path is not /404/index.html.
    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        internal;
    }
}
