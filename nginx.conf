server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Hardening -----------------------------------------------------------
    server_tokens off;              # don't leak the nginx version
    client_max_body_size 1m;        # this site takes no uploads
    include /etc/nginx/snippets/security-headers.conf;

    # Only read verbs are needed (the contact form is a client-side mailto).
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    # Never serve dotfiles (.git, .env, …). Keep ACME's /.well-known reachable.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # --- Caching -------------------------------------------------------------
    # Gzip text assets.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Long-cache the fingerprinted build assets (filenames change on rebuild).
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Never cache the HTML shell, so new deploys are picked up immediately.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # --- SPA fallback --------------------------------------------------------
    # Client-side routes (/work, /about, …) resolve to index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
